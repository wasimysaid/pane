[package]
name = "pane-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pane-target = { path = "../pane-target" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
unicase = "2.9"
unicode-normalization = "0.1"
wasmtime = { version = "=49.0.1", default-features = false, features = ["cache", "cranelift", "parallel-compilation", "runtime", "std", "async", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p3"] }
# `wasi:http@0.3.0` for guests (an extension's `client.send`), sent by Pane's
# own code (see `http`): the crate's default sender trusts a bundled root
# list under a license (CDLA-Permissive-2.0) outside deny.toml, where Pane
# trusts the system's certificates instead.
wasmtime-wasi-http = { version = "=49.0.1", default-features = false, features = ["p3", "component-model-async"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The native file watcher of development mode (inotify, FSEvents,
# ReadDirectoryChangesW), which builds a local package on save.
notify = "8.2"
# Installing npm packages (#45): the gzipped tarball and its sha512
# integrity, both already in the tree (image, Cranelift); the registry is
# reached through `http` above.
flate2 = "1"
tar = { version = "0.4.44", default-features = false }
sha2 = "0.10"

# Listing the Apps folder and opening a shortcut or packaged app as Explorer
# does, global hotkeys (`RegisterHotKey`), the Job Object that stops a
# development build with every process it started, and the clipboard format
# listener of clipboard history (a message-only window, the clipboard and its
# global memory); already in the dependency tree through GPUI CE.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# Global hotkeys on X11 (key grabs on the root window); already in the
# dependency tree through GPUI's X11 platform.
# Stopping a development build with the processes it started (a process
# group); already in the dependency tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xkb"] }

# Global hotkeys on macOS through Carbon's RegisterEventHotKey, which needs no
# Accessibility permission.
[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
tempfile = "3"
